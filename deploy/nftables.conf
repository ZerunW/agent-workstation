#!/usr/sbin/nft -f
# =============================================================================
# Agent Workstation firewall (optional)  --  install as /etc/nftables.conf (nftables.service).
# =============================================================================
# Adjust the placeholder network below to your machine first. Nothing installs this file for you.
#
# Policy: on every interface except loopback and tailscale0, drop everything except replies to connections the machine
# started, ICMP, DHCP, SSH from the admin network, and Tailscale's own UDP port. Everything arriving on tailscale0 and
# on loopback is allowed.
# Result: anything listening is unreachable from the LAN; Agent Workstation is used over the tailnet (nginx on the
# tailnet address, see deploy/nginx-tailscale.sh; the hub and status service listen on Unix sockets only). SSH stays
# reachable from the admin network (and IPv6 link-local, never from global IPv6) so the machine can be repaired when
# Tailscale is down.
#
# Design notes
#  * It owns exactly one table, `inet workstation_filter`, and never runs `flush ruleset`. Rules added by
#    Tailscale (ts-input, ts-forward), Docker or libvirt are left alone, and this file can be loaded
#    again at any time (the add/delete/define sequence below recreates the table cleanly).
#  * Only the INPUT hook is filtered. There is no forward chain on purpose: forwarded traffic keeps flowing.
#  * `iifname` (string match) is used instead of `iif` so the file loads even while tailscale0 does
#    not exist yet (boot order, tailscaled restarts).
#
# TEST IT WITH AN AUTOMATIC ROLLBACK before making it persistent (deploy/README.md has the full
# procedure):
#     sudo systemd-run --unit=workstation-fw-rollback --on-active=10min /usr/sbin/nft delete table inet workstation_filter
#     sudo nft -f /opt/agent-workstation/deploy/nftables.conf
#   ...check ssh over the LAN and the tailnet, and that the web UI is closed from the LAN (nc -z -w2 <lan address> 443),
#   then cancel the rollback:  sudo systemctl stop workstation-fw-rollback.timer
# Emergency removal at any time:  sudo nft delete table inet workstation_filter
# =============================================================================

# Placeholder: replace with the network SSH may come from. The agent account's name in the agent_output chain below must
# match WORKSTATION_AGENT_USER of deploy/install.sh.
define ADMIN_NET4 = 192.0.2.0/24

add table inet workstation_filter
delete table inet workstation_filter

table inet workstation_filter {
	chain input {
		type filter hook input priority 0; policy drop;

		# Garbage first, then replies to anything the machine itself started.
		ct state invalid drop
		ct state established,related accept

		# Local traffic (the services talking to each other).
		iif lo accept

		# The tailnet: full access (SSH, nginx on 80/443).
		iifname "tailscale0" accept

		# ICMP and ICMPv6: ping, path-MTU discovery, IPv6 neighbour discovery / router advertisements.
		meta l4proto { icmp, ipv6-icmp } accept

		# DHCP client replies (v4: server 67 -> client 68; v6: server 547 -> client 546).
		udp sport 67 udp dport 68 accept
		udp sport 547 udp dport 546 accept

		# Tailscale's own port: LAN peers connect directly instead of through a relay. Tailscale authenticates
		# every packet, so this exposes nothing.
		udp dport 41641 accept

		# SSH from the admin network only (the repair path when Tailscale is down); not from global IPv6.
		ip saddr $ADMIN_NET4 tcp dport 22 accept
		ip6 saddr fe80::/10 tcp dport 22 accept

		# Everything else from the LAN (mDNS, ...) falls through to the chain policy: drop.
	}

	# The agent firewall (same rules as deploy/workstation-agent-firewall, kept here too so loading this file alone also
	# has them; defense in depth, the hub's sockets are closed to the agent account by file permissions). Outbound only;
	# nothing else is filtered on output. Ports 80 and 443 of any address of this machine (`fib daddr type local`, the
	# Tailscale address included) are closed to it because nginx on the tailnet address forwards to the hub.
	chain agent_output {
		type filter hook output priority filter; policy accept;
		meta skuid "workstation-agent" tcp dport { 9000, 9100 } reject with tcp reset
		meta skuid "workstation-agent" fib daddr type local tcp dport { 80, 443 } reject with tcp reset
	}
}
