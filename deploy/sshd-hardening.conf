# =============================================================================
# sshd hardening  --  NOT INSTALLED BY ANY SCRIPT.
# =============================================================================
# Install as /etc/ssh/sshd_config.d/00-workstation-hardening.conf
#
#   The "00-" prefix matters. sshd uses the FIRST value it reads for each keyword, and drop-ins in
#   sshd_config.d are read in lexical order (the Include is at the top of Ubuntu's sshd_config), so
#   a leftover 50-cloud-init.conf with "PasswordAuthentication yes" would otherwise win.
#
# Procedure (keep your current SSH session open the whole time):
#   sudo install -m 644 /opt/agent-workstation/deploy/sshd-hardening.conf /etc/ssh/sshd_config.d/00-workstation-hardening.conf
#   sudo sshd -t                                   # must print nothing
#   sudo sshd -T | grep -Ei '^(passwordauthentication|kbdinteractiveauthentication|permitrootlogin|pubkeyauthentication) '
#   sudo systemctl reload ssh
#   # In a SECOND terminal, confirm key login still works:   ssh <your-admin-account>@<machine> true
#   # Only then close the first session.
# Revert:  sudo rm /etc/ssh/sshd_config.d/00-workstation-hardening.conf && sudo systemctl reload ssh
# If you ever lock yourself out: use the machine's console (deploy/README.md).
# =============================================================================

# Keys only. No passwords, not even through PAM's keyboard-interactive prompt.
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no

# Nobody logs in as root over SSH; use the service user plus sudo.
PermitRootLogin no

# Fewer guesses per connection and a shorter window to log in.
MaxAuthTries 3
LoginGraceTime 30

# Optional, enable if only one account should ever use SSH:
# AllowUsers your-admin-account
